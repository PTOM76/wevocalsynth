<!doctype html>
<!-- 追加機能の配信実験用ページ。実験が終わったら消す -->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>追加機能の配信テスト</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; max-width: 720px; }
  button { margin: 4px 4px 4px 0; padding: 8px 12px; font-size: 15px; }
  pre { background: #f4f4f4; padding: 8px; white-space: pre-wrap; word-break: break-all; font-size: 13px; }
  @media (prefers-color-scheme: dark) { body { background: #121212; color: #eee; } pre { background: #222; } }
</style>
</head>
<body>
<h1>追加機能の配信テスト</h1>
<p>Service Worker の状態: <span id="sw">確認中…</span></p>
<button id="net">1. ネットワークから取得</button>
<button id="save">2. 取得して Cache Storage に保存</button>
<button id="cached">3. 保存したものを読む（オフラインでも試す）</button>
<button id="clear">保存したものを削除</button>
<pre id="log"></pre>
<script>
  // 本番の設計と同じキャッシュ名（docs/EXTRACTOR.md）
  const CACHE = 'wevocalsynth-addons'
  // 末尾の / なし（/addons/test）で開かれても、このフォルダを基準にする
  const base = new URL(location.pathname.replace(/(\/index\.html)?\/?$/, '/'), location.href)
  const out = document.getElementById('log')
  const log = (s) => { out.textContent += s + '\n' }

  document.getElementById('sw').textContent = navigator.serviceWorker?.controller ? '制御中' : '制御されていない（一度アプリ本体を開いてから再読み込み）'

  async function manifest() {
    return (await fetch(new URL('manifest.json', base), { cache: 'no-store' })).json()
  }

  async function sha256(buf) {
    const h = await crypto.subtle.digest('SHA-256', buf)
    return [...new Uint8Array(h)].map((b) => b.toString(16).padStart(2, '0')).join('')
  }

  // レスポンスを最後まで読み、時間・大きさ・ヘッダー・ハッシュの一致を記録する
  async function report(label, res, expected) {
    const t0 = performance.now()
    const buf = await res.arrayBuffer()
    const sec = (performance.now() - t0) / 1000
    const mb = buf.byteLength / 1024 / 1024
    log(`[${label}] status ${res.status}, ${mb.toFixed(1)} MB, 読み込み ${sec.toFixed(2)} 秒 (${(mb / sec).toFixed(1)} MB/s)`)
    for (const k of ['content-type', 'content-length', 'content-encoding', 'cache-control', 'etag', 'last-modified']) {
      log(`  ${k}: ${res.headers.get(k)}`)
    }
    log(`  sha256 一致: ${(await sha256(buf)) === expected.sha256}`)
  }

  async function run(fn) {
    try { await fn() } catch (e) { log('エラー: ' + e) }
    const est = await navigator.storage?.estimate?.()
    if (est) log(`  使用量 ${(est.usage / 1024 / 1024).toFixed(1)} MB / 上限 ${(est.quota / 1024 / 1024).toFixed(0)} MB`)
    log('')
  }

  document.getElementById('net').onclick = () => run(async () => {
    const m = await manifest()
    const t0 = performance.now()
    const res = await fetch(new URL(m.files[0].path, base), { cache: 'no-store' })
    log(`[ネットワーク] 応答まで ${((performance.now() - t0) / 1000).toFixed(2)} 秒`)
    await report('ネットワーク', res, m.files[0])
  })

  document.getElementById('save').onclick = () => run(async () => {
    const m = await manifest()
    const url = new URL(m.files[0].path, base)
    const res = await fetch(url, { cache: 'no-store' })
    const cache = await caches.open(CACHE)
    await cache.put(url, res.clone())
    await cache.put(new URL('manifest.json', base), new Response(JSON.stringify(m)))
    await report('保存', res, m.files[0])
  })

  // fetch を通すので、Service Worker が保存先から返せているか（オフライン時）も確かめられる
  document.getElementById('cached').onclick = () => run(async () => {
    const cache = await caches.open(CACHE)
    const mres = await cache.match(new URL('manifest.json', base))
    if (!mres) { log('未保存'); return }
    const m = await mres.json()
    const url = new URL(m.files[0].path, base)
    // 失敗したときに原因を絞るための情報（保存先に直接あるか、どの Service Worker か、vary の有無）
    const direct = await cache.match(url)
    log(`[診断] online: ${navigator.onLine}, SW: ${navigator.serviceWorker?.controller?.scriptURL}`)
    log(`[診断] 保存先に直接: ${direct ? 'あり' : 'なし'}, vary: ${direct?.headers.get('vary')}`)
    log(`[診断] 保存先のキー: ${(await cache.keys()).map((r) => r.url).join(', ')}`)
    await report('fetch 経由', await fetch(url), m.files[0])
  })

  document.getElementById('clear').onclick = () => run(async () => {
    log(`削除: ${await caches.delete(CACHE)}`)
  })
</script>
</body>
</html>
